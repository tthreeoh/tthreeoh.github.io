<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREEFLOW</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #e63946;
    --red-dim: #7a1d22;
    --bg: #080808;
    --surface: #111;
    --surface2: #181818;
    --border: #222;
    --text: #e8e4dc;
    --muted: #666;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }

  html {
    font-size: 200%;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    overflow: hidden;
  }

  /* ── APP SHELL ── */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }

  /* ── HEADER ── */
  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    height: 52px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 50;
  }

  .logo {
    font-family: var(--font-display);
    font-size: 26px;
    letter-spacing: 0.05em;
    color: var(--red);
    flex-shrink: 0;
  }

  .tab-group {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }

  .tab {
    background: none;
    border: 1px solid transparent;
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 5px 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--red);
    border-color: var(--red-dim);
    background: rgba(230,57,70,0.08);
  }

  .search-wrap {
    display: flex;
    align-items: center;
    flex: 1;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 0 12px;
    gap: 8px;
  }

  .search-wrap svg { flex-shrink: 0; opacity: 0.4; }

  .search-wrap input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13px;
    width: 100%;
    padding: 8px 0;
  }
  .search-wrap input::placeholder { color: var(--muted); }

  .tt-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }

  .tt-input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 12px;
    padding: 6px 10px;
    width: 120px;
    outline: none;
  }
  .tt-input::placeholder { color: var(--muted); }
  .tt-input:focus { border-color: var(--red-dim); }

  .btn {
    background: var(--red);
    border: none;
    color: #fff;
    font-family: var(--font-display);
    font-size: 14px;
    letter-spacing: 0.06em;
    padding: 6px 14px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-ghost {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 11px;
    padding: 5px 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-ghost:hover { border-color: var(--red-dim); color: var(--red); }
  .btn-ghost:disabled { opacity: 0.25; pointer-events: none; }

  /* ── HISTORY / BREADCRUMB ── */
  .nav-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 20px;
    height: 34px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    overflow: hidden;
  }

  .nav-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 4px 6px;
    font-size: 14px;
    line-height: 1;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .nav-btn:hover { color: var(--text); }
  .nav-btn:disabled { opacity: 0.2; pointer-events: none; }

  .nav-sep { color: #333; font-size: 12px; flex-shrink: 0; }

  .breadcrumbs {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow: hidden;
    flex: 1;
    min-width: 0;
  }

  .crumb {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    transition: color 0.15s;
    flex-shrink: 1;
    min-width: 0;
  }
  .crumb:hover { color: var(--red); }
  .crumb.current { color: var(--text); cursor: default; pointer-events: none; flex-shrink: 0; }
  .crumb-sep { color: #333; font-size: 10px; flex-shrink: 0; }

  /* ── MAIN ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── BROWSE PANEL ── */
  .browse-panel {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    padding: 20px;
    display: none;
  }
  .browse-panel.visible { display: block; }

  .section-title {
    font-family: var(--font-display);
    font-size: 20px;
    letter-spacing: 0.05em;
    color: var(--text);
    margin-bottom: 14px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(8em, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }

  .card {
    cursor: pointer;
    position: relative;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    transition: transform 0.15s, border-color 0.15s;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--red-dim);
  }

  .card:hover .card-overlay { opacity: 1; }

  .card-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.5) 70%, transparent 100%);
    padding: 28px 6px 6px;
    display: flex;
    gap: 5px;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .card-action {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 7px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
    font-family: var(--font-body);
  }
  .card-action:hover { background: rgba(255,255,255,0.18); }
  .card-action.in-list { background: rgba(230,57,70,0.3); border-color: var(--red-dim); color: var(--red); }
  .card-action.watched { background: rgba(76,175,80,0.25); border-color: #1a3a1a; color: #4caf50; }

  .card-watched-badge {
    position: absolute;
    bottom: 38px; right: 6px;
    font-size: 8px;
    color: #4caf50;
    background: rgba(0,0,0,0.75);
    border: 1px solid #1a3a1a;
    padding: 2px 5px;
    pointer-events: none;
    display: none;
  }
  .card.is-watched .card-watched-badge { display: block; }

  .card img {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    display: block;
    filter: brightness(0.9);
  }

  .card-info {
    padding: 8px;
  }

  .card-title {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .card-meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .card-type-badge {
    position: absolute;
    top: 6px;
    left: 6px;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 5px;
    background: rgba(0,0,0,0.75);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .card-type-badge.tv { color: #4fc3f7; border-color: #1a4a5a; }

  .no-poster {
    width: 100%;
    aspect-ratio: 2/3;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 11px;
  }

  /* ── PLAYER PANEL ── */
  .player-panel {
    display: none;
    flex: 1;
    flex-direction: column;
    overflow: hidden;
  }
  .player-panel.visible { display: flex; }

  /* THE KEY FIX: iframe container uses position relative + padding trick,
     AND the iframe itself gets allowfullscreen properly */
  .player-container {
    position: relative;
    flex: 1;
    background: #000;
    overflow: hidden;
  }

  .player-container iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .player-meta {
    flex-shrink: 0;
    display: flex;
    align-items: flex-start;
    gap: 20px;
    padding: 14px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }

  .player-poster {
    width: 56px;
    height: 84px;
    object-fit: cover;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .player-details { flex: 1; }

  .player-title {
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 0.04em;
    line-height: 1.1;
    margin-bottom: 4px;
  }

  .player-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }

  .ptag {
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 2px 7px;
  }
  .ptag.red { color: var(--red); border-color: var(--red-dim); }

  .player-plot {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
    max-width: 700px;
  }

  .player-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  /* ── EPISODE SELECTOR (TV) ── */
  .episode-bar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 8px 20px;
    background: var(--surface2);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .episode-bar.visible { display: flex; }
  .episode-bar label { font-size: 12px; color: var(--muted); }
  .episode-bar select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 12px;
    padding: 4px 8px;
    outline: none;
    cursor: pointer;
  }
  .episode-bar select:focus { border-color: var(--red-dim); }

  /* ── LOADING / EMPTY ── */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.05em;
  }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .key-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    border-left: 1px solid var(--border);
    padding-left: 12px;
    flex-shrink: 0;
  }

  .key-wrap.saved .key-dot {
    background: #4caf50;
  }

  .key-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }

  /* ── WATCHLIST DRAWER ── */
  .wl-drawer {
    position: fixed;
    top: 0; right: -360px;
    width: 360px;
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 200;
    display: flex;
    flex-direction: column;
    transition: right 0.25s cubic-bezier(.4,0,.2,1);
  }
  .wl-drawer.open { right: 0; }

  .wl-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 199;
  }
  .wl-overlay.open { display: block; }

  .wl-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .wl-title {
    font-family: var(--font-display);
    font-size: 18px;
    letter-spacing: 0.05em;
    color: var(--text);
  }

  .wl-count {
    font-size: 11px;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 2px 7px;
    margin-left: 8px;
  }

  .wl-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
    transition: color 0.15s;
  }
  .wl-close:hover { color: var(--red); }

  .wl-actions {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .wl-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  .wl-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-size: 12px;
    gap: 8px;
    opacity: 0.5;
  }

  .wl-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    border-bottom: 1px solid #1a1a1a;
    cursor: pointer;
    transition: background 0.1s;
  }
  .wl-item:hover { background: var(--surface2); }

  .wl-item-poster {
    width: 32px;
    height: 48px;
    object-fit: cover;
    border: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface2);
  }

  .wl-item-info { flex: 1; min-width: 0; }

  .wl-item-title {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .wl-item-meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .watched-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4caf50;
    margin-right: 4px;
    vertical-align: middle;
  }

  .wl-item-remove {
    background: none;
    border: none;
    color: #333;
    font-size: 16px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
    flex-shrink: 0;
    transition: color 0.15s;
  }
  .wl-item-remove:hover { color: var(--red); }

  .wl-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 500;
    padding: 5px 10px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .wl-btn:hover { border-color: var(--red-dim); color: var(--red); }

  .list-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--red);
    color: #fff;
    border-radius: 50%;
    font-size: 9px;
    width: 14px;
    height: 14px;
    margin-left: 4px;
    font-weight: 600;
    vertical-align: middle;
    line-height: 1;
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: #444; }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">FREEFLOW</div>

    <div class="tab-group">
      <button class="tab active" data-tab="trending">Trending</button>
      <button class="tab" data-tab="movies">Movies</button>
      <button class="tab" data-tab="tv">TV Shows</button>
    </div>

    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="searchInput" type="text" placeholder="Search movies & TV..." autocomplete="off">
    </div>

    <div class="tt-wrap">
      <input id="ttInput" class="tt-input" type="text" placeholder="tt0052077" maxlength="20">
      <button class="btn" id="ttBtn">PLAY</button>
    </div>

    <div class="key-wrap" title="OMDB API Key">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:0.4;flex-shrink:0"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
      <input id="keyInput" class="tt-input" type="password" placeholder="OMDB key" style="width:90px">
      <button class="btn-ghost" id="keyBtn">SET</button>
      <span class="key-dot" id="keyDot" title="No key set"></span>
    </div>

    <button class="btn-ghost" id="wlOpenBtn" style="border-left:1px solid var(--border);padding-left:14px;margin-left:2px;border-radius:0;border-top:none;border-bottom:none;border-right:none;">
      ☰ LIST <span class="list-badge" id="wlBadge" style="display:none">0</span>
    </button>
  </header>

  <!-- WATCHLIST DRAWER -->
  <div class="wl-overlay" id="wlOverlay"></div>
  <div class="wl-drawer" id="wlDrawer">
    <div class="wl-header">
      <div style="display:flex;align-items:center">
        <span class="wl-title">WATCHLIST</span>
        <span class="wl-count" id="wlCount">0 titles</span>
      </div>
      <button class="wl-close" id="wlCloseBtn">✕</button>
    </div>
    <div class="wl-actions">
      <button class="wl-btn" id="wlExportCSV">↓ CSV</button>
      <button class="wl-btn" id="wlExportJSON">↓ JSON</button>
      <button class="wl-btn" id="wlClearBtn" style="margin-left:auto;color:#555">CLEAR ALL</button>
    </div>
    <div class="wl-list" id="wlList">
      <div class="wl-empty" id="wlEmpty">
        <div style="font-size:24px">📋</div>
        <div>Your list is empty</div>
        <div style="font-size:10px">Add titles while watching</div>
      </div>
    </div>
  </div>

  <!-- NAV BAR -->
  <div class="nav-bar">
    <button class="nav-btn" id="navBack" title="Back" disabled>&#8592;</button>
    <button class="nav-btn" id="navFwd" title="Forward" disabled>&#8594;</button>
    <div class="nav-sep">|</div>
    <div class="breadcrumbs" id="breadcrumbs"></div>
  </div>

  <!-- MAIN -->
  <main class="main">

    <!-- BROWSE -->
    <div class="browse-panel visible" id="browsePanel">
      <div id="browseContent"><div class="loading"><div class="spinner"></div>Loading...</div></div>
    </div>

    <!-- PLAYER -->
    <div class="player-panel" id="playerPanel">
      <div class="player-container">
        <iframe id="playerIframe"
          src=""
          allowfullscreen="true"
          webkitallowfullscreen="true"
          mozallowfullscreen="true"
          allow="autoplay; fullscreen; picture-in-picture"
          frameborder="0"
          scrolling="no">
        </iframe>
      </div>

      <div class="episode-bar" id="episodeBar">
        <label>Season</label>
        <select id="seasonSel"></select>
        <label>Episode</label>
        <select id="episodeSel"></select>
        <button class="btn" id="epPlayBtn">PLAY EPISODE</button>
      </div>

      <div class="player-meta">
        <img id="playerPoster" class="player-poster" src="" alt="">
        <div class="player-details">
          <div class="player-title" id="playerTitle">—</div>
          <div class="player-tags" id="playerTags"></div>
          <div class="player-plot" id="playerPlot"></div>
        </div>
        <div class="player-actions">
          <button class="btn-ghost" id="backBtn">← BROWSE</button>
          <button class="btn-ghost" id="wlAddBtn">+ ADD TO LIST</button>
          <button class="btn-ghost" id="fullscreenBtn">⛶ FULLSCREEN</button>
        </div>
      </div>
    </div>

  </main>
</div>

<script>
const OMDB_KEY = 'trilogy'; // <-- replace with your OMDB key

// ── Elements ──
const browsePanel  = document.getElementById('browsePanel');
const playerPanel  = document.getElementById('playerPanel');
const browseContent= document.getElementById('browseContent');
const playerIframe = document.getElementById('playerIframe');
const playerTitle  = document.getElementById('playerTitle');
const playerTags   = document.getElementById('playerTags');
const playerPlot   = document.getElementById('playerPlot');
const playerPoster = document.getElementById('playerPoster');
const episodeBar   = document.getElementById('episodeBar');
const seasonSel    = document.getElementById('seasonSel');
const episodeSel   = document.getElementById('episodeSel');
const searchInput  = document.getElementById('searchInput');
const ttInput      = document.getElementById('ttInput');
const navBackBtn   = document.getElementById('navBack');
const navFwdBtn    = document.getElementById('navFwd');
const breadcrumbs  = document.getElementById('breadcrumbs');
const keyInput     = document.getElementById('keyInput');
const keyDot       = document.getElementById('keyDot');
const keyWrap      = document.querySelector('.key-wrap');

// ── API key management ──
let omdbKey = localStorage.getItem('omdb_key') || OMDB_KEY;

function updateKeyUI(valid) {
  keyDot.style.background = valid ? '#4caf50' : '#666';
  keyDot.title = valid ? 'Key active' : 'No key set';
}

// Restore saved key on load
if (localStorage.getItem('omdb_key')) {
  keyInput.value = localStorage.getItem('omdb_key');
  updateKeyUI(true);
}

document.getElementById('keyBtn').addEventListener('click', async () => {
  const val = keyInput.value.trim();
  if (!val) return;
  // Quick validation ping
  const test = await fetch(`https://www.omdbapi.com/?apikey=${val}&i=tt0052077`).then(r => r.json());
  if (test.Response === 'True') {
    omdbKey = val;
    localStorage.setItem('omdb_key', val);
    updateKeyUI(true);
    loadBrowse(currentTab);
  } else {
    updateKeyUI(false);
    keyDot.style.background = '#e63946';
    keyDot.title = 'Invalid key';
  }
});
keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('keyBtn').click(); });

// ── History stack ──
// Each entry: { type: 'browse'|'search'|'player', tab?, query?, imdbId?, mediaType?, label }
let history = [];
let historyIdx = -1;
let navigating = false; // flag to prevent pushState while replaying

function pushHistory(entry) {
  if (navigating) return;
  // Drop any forward history when navigating to a new place
  history = history.slice(0, historyIdx + 1);
  history.push(entry);
  historyIdx = history.length - 1;
  updateNavUI();
}

function updateNavUI() {
  navBackBtn.disabled = historyIdx <= 0;
  navFwdBtn.disabled  = historyIdx >= history.length - 1;
  renderBreadcrumbs();
}

function renderBreadcrumbs() {
  if (!history.length) { breadcrumbs.innerHTML = ''; return; }
  // Show last 5 entries max
  const start = Math.max(0, historyIdx - 4);
  const visible = history.slice(start, historyIdx + 1);
  breadcrumbs.innerHTML = visible.map((e, i) => {
    const realIdx = start + i;
    const isCurrent = realIdx === historyIdx;
    const sep = i > 0 ? '<span class="crumb-sep">›</span>' : '';
    return `${sep}<span class="crumb${isCurrent ? ' current' : ''}" data-idx="${realIdx}">${e.label}</span>`;
  }).join('');
  breadcrumbs.querySelectorAll('.crumb:not(.current)').forEach(el => {
    el.addEventListener('click', () => goToHistoryIdx(parseInt(el.dataset.idx)));
  });
}

async function goToHistoryIdx(idx) {
  if (idx < 0 || idx >= history.length) return;
  historyIdx = idx;
  navigating = true;
  await replayEntry(history[idx]);
  navigating = false;
  updateNavUI();
}

async function replayEntry(entry) {
  if (entry.type === 'browse') {
    // Restore tab state
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === entry.tab);
    });
    currentTab = entry.tab;
    searchInput.value = '';
    showBrowse();
    await loadBrowse(entry.tab);

  } else if (entry.type === 'search') {
    searchInput.value = entry.query;
    showBrowse();
    await execSearch(entry.query);

  } else if (entry.type === 'player') {
    showPlayer();
    await execLoadPlayer(entry.imdbId, entry.mediaType);
  }
}

// ── State ──
let currentTab = 'trending';
let searchTimer = null;

// ── Panel toggles ──
function showBrowse() {
  browsePanel.classList.add('visible');
  playerPanel.classList.remove('visible');
}
function showPlayer() {
  browsePanel.classList.remove('visible');
  playerPanel.classList.add('visible');
}

// ── OMDB fetch ──
async function omdb(params) {
  const url = new URL('https://www.omdbapi.com/');
  url.searchParams.set('apikey', omdbKey);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  const r = await fetch(url);
  return r.json();
}

// ── Curated IDs ──
const TRENDING_IDS   = ['tt9362722','tt1375666','tt0816692','tt0468569','tt0111161','tt0137523','tt0120737','tt0110912','tt0944947','tt5491994','tt0903747','tt2861424','tt4574334','tt0386676','tt1520211'];
const POPULAR_MOVIES = ['tt1375666','tt0816692','tt0468569','tt0111161','tt0110912','tt0137523','tt0120737','tt0109830','tt0133093','tt0245429','tt0317248','tt0477347','tt1745960','tt3896198'];
const POPULAR_TV     = ['tt0944947','tt0903747','tt5491994','tt2861424','tt4574334','tt0386676','tt1520211','tt0804484','tt3032476','tt2306299','tt6468322','tt7366338','tt1877514'];

// ── Render grid ──
function renderGrid(items, container) {
  if (!items.length) { container.innerHTML = '<div class="loading">No results found.</div>'; return; }
  container.innerHTML = items.map(m => {
    const poster = m.Poster && m.Poster !== 'N/A'
      ? `<img src="${m.Poster}" alt="${m.Title}" loading="lazy">`
      : `<div class="no-poster">No Image</div>`;
    const isTV = m.Type === 'series';
    const inList = watchlist.some(w => w.imdbId === m.imdbID);
    const isWatched = watchlist.find(w => w.imdbId === m.imdbID)?.watchedAt;
    return `
      <div class="card${isWatched ? ' is-watched' : ''}" data-imdb="${m.imdbID}" data-type="${m.Type || 'movie'}" data-title="${(m.Title||'').replace(/"/g,'&quot;')}" data-year="${m.Year||''}" data-poster="${m.Poster !== 'N/A' ? m.Poster : ''}" data-rating="${m.imdbRating||''}">
        ${isTV ? '<span class="card-type-badge tv">TV</span>' : ''}
        ${poster}
        <span class="card-watched-badge">✓ watched</span>
        <div class="card-overlay">
          <button class="card-action${inList ? ' in-list' : ''} ca-list" data-imdb="${m.imdbID}">${inList ? '✓ listed' : '+ list'}</button>
          <button class="card-action${isWatched ? ' watched' : ''} ca-watched" data-imdb="${m.imdbID}">${isWatched ? '✓ watched' : '👁 watched'}</button>
        </div>
        <div class="card-info">
          <div class="card-title">${m.Title}</div>
          <div class="card-meta">${m.Year || ''}</div>
        </div>
      </div>`;
  }).join('');

  container.querySelectorAll('.card').forEach(c => {
    // Click card body → play (but not the overlay buttons)
    c.addEventListener('click', e => {
      if (e.target.closest('.card-action')) return;
      loadPlayer(c.dataset.imdb, c.dataset.type);
    });

    // + List button
    c.querySelector('.ca-list').addEventListener('click', e => {
      e.stopPropagation();
      const id = c.dataset.imdb;
      const btn = c.querySelector('.ca-list');
      if (watchlist.some(w => w.imdbId === id)) {
        watchlist = watchlist.filter(w => w.imdbId !== id);
        btn.textContent = '+ list'; btn.classList.remove('in-list');
      } else {
        watchlist.push({ imdbId: id, title: c.dataset.title, year: c.dataset.year, type: c.dataset.type, poster: c.dataset.poster, rating: c.dataset.rating, addedAt: new Date().toISOString(), watchedAt: null });
        btn.textContent = '✓ listed'; btn.classList.add('in-list');
      }
      saveWatchlist(); renderWatchlist(); updateAddBtn();
    });

    // ✓ Watched button
    c.querySelector('.ca-watched').addEventListener('click', e => {
      e.stopPropagation();
      const id = c.dataset.imdb;
      const btn = c.querySelector('.ca-watched');
      let entry = watchlist.find(w => w.imdbId === id);
      if (!entry) {
        // auto-add to list too
        entry = { imdbId: id, title: c.dataset.title, year: c.dataset.year, type: c.dataset.type, poster: c.dataset.poster, rating: c.dataset.rating, addedAt: new Date().toISOString(), watchedAt: null };
        watchlist.push(entry);
        c.querySelector('.ca-list').textContent = '✓ listed';
        c.querySelector('.ca-list').classList.add('in-list');
      }
      if (entry.watchedAt) {
        entry.watchedAt = null;
        btn.textContent = '👁 watched'; btn.classList.remove('watched');
        c.classList.remove('is-watched');
      } else {
        entry.watchedAt = new Date().toISOString();
        btn.textContent = '✓ watched'; btn.classList.add('watched');
        c.classList.add('is-watched');
      }
      saveWatchlist(); renderWatchlist(); updateAddBtn();
    });
  });
}

async function fetchMany(ids) {
  const results = await Promise.all(ids.map(id => omdb({ i: id })));
  return results.filter(r => r.Response === 'True');
}

// ── Browse ──
async function loadBrowse(tab) {
  browseContent.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
  const labels = { trending: 'Trending Now', movies: 'Popular Movies', tv: 'Popular TV Shows' };
  const ids = { trending: TRENDING_IDS, movies: POPULAR_MOVIES, tv: POPULAR_TV };
  const gridId = { trending: 'trendGrid', movies: 'movGrid', tv: 'tvGrid' };
  const items = await fetchMany(ids[tab]);
  browseContent.innerHTML = `<div class="section-title">${labels[tab]}</div><div class="grid" id="${gridId[tab]}"></div>`;
  renderGrid(items, document.getElementById(gridId[tab]));
}

// ── Search ──
async function execSearch(query) {
  browseContent.innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';
  const data = await omdb({ s: query, type: currentTab === 'tv' ? 'series' : '' });
  if (data.Response === 'True') {
    browseContent.innerHTML = `<div class="section-title">Results for "${query}"</div><div class="grid" id="srchGrid"></div>`;
    renderGrid(data.Search, document.getElementById('srchGrid'));
  } else {
    browseContent.innerHTML = `<div class="loading">No results for "${query}"</div>`;
  }
}

async function doSearch(query) {
  if (!query.trim()) {
    pushHistory({ type: 'browse', tab: currentTab, label: currentTab.charAt(0).toUpperCase() + currentTab.slice(1) });
    showBrowse();
    await loadBrowse(currentTab);
    return;
  }
  pushHistory({ type: 'search', query, label: `🔍 "${query}"` });
  showBrowse();
  await execSearch(query);
}

// ── Player ──
async function execLoadPlayer(imdbId, type) {
  playerIframe.src = type === 'series'
    ? `https://vidsrc.me/embed/tv?imdb=${imdbId}&season=1&episode=1`
    : `https://vidsrc.me/embed/movie?imdb=${imdbId}`;

  const data = await omdb({ i: imdbId, plot: 'short' });
  if (data.Response !== 'True') return;

  currentMeta = data;
  updateAddBtn();

  playerTitle.textContent = data.Title;
  playerPoster.src = data.Poster !== 'N/A' ? data.Poster : '';
  playerPoster.style.display = data.Poster !== 'N/A' ? '' : 'none';
  playerPlot.textContent = data.Plot !== 'N/A' ? data.Plot : '';

  const tags = [];
  if (data.Year) tags.push({ text: data.Year });
  if (data.Rated && data.Rated !== 'N/A') tags.push({ text: data.Rated, red: true });
  if (data.Runtime && data.Runtime !== 'N/A') tags.push({ text: data.Runtime });
  if (data.Genre) data.Genre.split(', ').forEach(g => tags.push({ text: g }));
  if (data.imdbRating && data.imdbRating !== 'N/A') tags.push({ text: '★ ' + data.imdbRating, red: true });
  playerTags.innerHTML = tags.map(t => `<span class="ptag${t.red ? ' red' : ''}">${t.text}</span>`).join('');

  if (type === 'series' && data.totalSeasons && parseInt(data.totalSeasons) > 0) {
    const total = parseInt(data.totalSeasons);
    seasonSel.innerHTML = Array.from({ length: total }, (_, i) => `<option value="${i+1}">Season ${i+1}</option>`).join('');
    episodeSel.innerHTML = Array.from({ length: 20 }, (_, i) => `<option value="${i+1}">Episode ${i+1}</option>`).join('');
    episodeBar.classList.add('visible');
  } else {
    episodeBar.classList.remove('visible');
  }
  episodeBar.dataset.imdb = imdbId;
}

async function loadPlayer(imdbId, type) {
  // Peek at title for breadcrumb label
  const data = await omdb({ i: imdbId });
  const label = data.Response === 'True' ? data.Title : imdbId;
  pushHistory({ type: 'player', imdbId, mediaType: type, label });
  showPlayer();
  await execLoadPlayer(imdbId, type);
}

// ── Nav buttons ──
navBackBtn.addEventListener('click', () => goToHistoryIdx(historyIdx - 1));
navFwdBtn.addEventListener('click',  () => goToHistoryIdx(historyIdx + 1));

// ── Keyboard shortcuts ──
document.addEventListener('keydown', e => {
  if ((e.altKey || e.metaKey) && e.key === 'ArrowLeft')  { e.preventDefault(); if (!navBackBtn.disabled) navBackBtn.click(); }
  if ((e.altKey || e.metaKey) && e.key === 'ArrowRight') { e.preventDefault(); if (!navFwdBtn.disabled)  navFwdBtn.click(); }
});

// ── Episode play ──
document.getElementById('epPlayBtn').addEventListener('click', () => {
  const imdb = episodeBar.dataset.imdb;
  const s = seasonSel.value, e = episodeSel.value;
  playerIframe.src = `https://vidsrc.me/embed/tv?imdb=${imdb}&season=${s}&episode=${e}`;
});

// ── Tabs ──
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    searchInput.value = '';
    const label = tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1);
    pushHistory({ type: 'browse', tab: currentTab, label });
    showBrowse();
    loadBrowse(currentTab);
  });
});

// ── Search ──
searchInput.addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => doSearch(e.target.value), 400);
});

// ── TT direct ──
document.getElementById('ttBtn').addEventListener('click', () => {
  const tt = ttInput.value.trim();
  if (!tt) return;
  const id = tt.startsWith('tt') ? tt : 'tt' + tt;
  loadPlayer(id, 'movie');
});
ttInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('ttBtn').click(); });

// ── Back to browse (player meta button) ──
document.getElementById('backBtn').addEventListener('click', () => {
  if (!navBackBtn.disabled) navBackBtn.click();
  else {
    playerIframe.src = '';
    episodeBar.classList.remove('visible');
    pushHistory({ type: 'browse', tab: currentTab, label: currentTab.charAt(0).toUpperCase() + currentTab.slice(1) });
    showBrowse();
    loadBrowse(currentTab);
  }
});

// ── Fullscreen ──
document.getElementById('fullscreenBtn').addEventListener('click', () => {
  const req = playerIframe.requestFullscreen || playerIframe.webkitRequestFullscreen || playerIframe.mozRequestFullScreen;
  if (req) req.call(playerIframe);
});

// ── Watchlist ──
let watchlist = JSON.parse(localStorage.getItem('freeflow_watchlist') || '[]');
let currentMeta = null; // holds last loaded movie data for adding

function saveWatchlist() {
  localStorage.setItem('freeflow_watchlist', JSON.stringify(watchlist));
}

function renderWatchlist() {
  const count = watchlist.length;
  document.getElementById('wlCount').textContent = count + ' title' + (count !== 1 ? 's' : '');
  const badge = document.getElementById('wlBadge');
  if (count > 0) { badge.style.display = ''; badge.textContent = count; }
  else { badge.style.display = 'none'; }

  const empty = document.getElementById('wlEmpty');
  const list  = document.getElementById('wlList');

  if (!count) {
    empty.style.display = 'flex';
    // remove all items
    list.querySelectorAll('.wl-item').forEach(el => el.remove());
    return;
  }
  empty.style.display = 'none';
  list.querySelectorAll('.wl-item').forEach(el => el.remove());
  watchlist.forEach(item => {
    const div = document.createElement('div');
    div.className = 'wl-item';
    const watchedStr = item.watchedAt
      ? `<span class="watched-dot"></span>watched ${new Date(item.watchedAt).toLocaleDateString()}`
      : 'not watched';
    div.innerHTML = `
      <img class="wl-item-poster" src="${item.poster || ''}" alt="" onerror="this.style.display='none'">
      <div class="wl-item-info">
        <div class="wl-item-title">${item.title}</div>
        <div class="wl-item-meta">${item.year || ''} · ${item.type === 'series' ? 'TV' : 'Movie'}${item.rating ? ' · ★ ' + item.rating : ''}</div>
        <div class="wl-item-meta" style="margin-top:3px;font-size:10px">${watchedStr}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex-shrink:0">
        <button class="wl-item-remove" data-id="${item.imdbId}" title="Remove">✕</button>
        <button class="wl-btn wl-toggle-watched" data-id="${item.imdbId}" style="font-size:9px;padding:3px 6px;${item.watchedAt ? 'color:#4caf50;border-color:#1a3a1a' : ''}">${item.watchedAt ? '✓ seen' : '👁 mark'}</button>
      </div>`;
    div.querySelector('.wl-item-info').addEventListener('click', () => {
      closeDrawer();
      loadPlayer(item.imdbId, item.type);
    });
    div.querySelector('.wl-item-remove').addEventListener('click', e => {
      e.stopPropagation();
      watchlist = watchlist.filter(w => w.imdbId !== item.imdbId);
      saveWatchlist(); renderWatchlist(); updateAddBtn();
    });
    div.querySelector('.wl-toggle-watched').addEventListener('click', e => {
      e.stopPropagation();
      const entry = watchlist.find(w => w.imdbId === item.imdbId);
      if (entry) {
        entry.watchedAt = entry.watchedAt ? null : new Date().toISOString();
        saveWatchlist(); renderWatchlist(); updateAddBtn();
      }
    });
    list.appendChild(div);
  });
}

function updateAddBtn() {
  const btn = document.getElementById('wlAddBtn');
  if (!currentMeta) return;
  const inList = watchlist.some(w => w.imdbId === currentMeta.imdbID);
  btn.textContent = inList ? '✓ IN LIST' : '+ ADD TO LIST';
  btn.style.color = inList ? '#4caf50' : '';
  btn.style.borderColor = inList ? '#1a3a1a' : '';
}

function openDrawer()  { document.getElementById('wlDrawer').classList.add('open'); document.getElementById('wlOverlay').classList.add('open'); }
function closeDrawer() { document.getElementById('wlDrawer').classList.remove('open'); document.getElementById('wlOverlay').classList.remove('open'); }

document.getElementById('wlOpenBtn').addEventListener('click', openDrawer);
document.getElementById('wlCloseBtn').addEventListener('click', closeDrawer);
document.getElementById('wlOverlay').addEventListener('click', closeDrawer);

document.getElementById('wlAddBtn').addEventListener('click', () => {
  if (!currentMeta) return;
  const id = currentMeta.imdbID;
  if (watchlist.some(w => w.imdbId === id)) {
    watchlist = watchlist.filter(w => w.imdbId !== id);
  } else {
    watchlist.push({
      imdbId: id,
      title: currentMeta.Title,
      year: currentMeta.Year,
      type: currentMeta.Type,
      poster: currentMeta.Poster !== 'N/A' ? currentMeta.Poster : '',
      rating: currentMeta.imdbRating !== 'N/A' ? currentMeta.imdbRating : '',
      genre: currentMeta.Genre,
      addedAt: new Date().toISOString()
    });
  }
  saveWatchlist();
  renderWatchlist();
  updateAddBtn();
});

document.getElementById('wlClearBtn').addEventListener('click', () => {
  if (!watchlist.length) return;
  if (confirm('Clear entire watchlist?')) {
    watchlist = [];
    saveWatchlist();
    renderWatchlist();
    updateAddBtn();
  }
});

// ── Export ──
function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById('wlExportCSV').addEventListener('click', () => {
  if (!watchlist.length) return;
  const header = 'Title,Year,Type,IMDb ID,Rating,Genre,Added,Watched\n';
  const rows = watchlist.map(w =>
    [w.title, w.year, w.type, w.imdbId, w.rating, w.genre, w.addedAt, w.watchedAt || '']
    .map(v => `"${(v||'').replace(/"/g,'""')}"`)
    .join(',')
  ).join('\n');
  downloadFile(header + rows, 'watchlist.csv', 'text/csv');
});

document.getElementById('wlExportJSON').addEventListener('click', () => {
  if (!watchlist.length) return;
  downloadFile(JSON.stringify(watchlist, null, 2), 'watchlist.json', 'application/json');
});

renderWatchlist();

// ── Init ──
pushHistory({ type: 'browse', tab: 'trending', label: 'Trending' });
showBrowse();
loadBrowse('trending');
</script>
